<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FlowForge</title>

    <link rel="stylesheet" href="/auth.css">
</head>

<body>

<div class="auth-shell">

    <div class="auth-brand">
        <div class="brand-mark">F</div>
        <div>
            <h1>FlowForge</h1>
            <p>Collaborate. Organize. Deliver.</p>
        </div>
    </div>

    <div class="auth-card">

        <div class="auth-header">
            <span class="eyebrow">GET STARTED</span>
            <h2>Create your account</h2>
            <p>Set up your workspace and start organizing work with your team.</p>
        </div>

        <form id="registerForm">

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div id="message" class="message"></div>

            <button type="submit" id="registerButton" class="auth-button">
                <span>Create account</span>
                <span class="button-arrow">→</span>
            </button>

        </form>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a href="/login.html">Sign in</a>
        </div>

    </div>

    <div class="auth-bottom">
        <span>FlowForge</span>
        <span>•</span>
        <span>Real-time collaborative workspace</span>
    </div>

</div>

<script src="/auth.js"></script>

</body>
</html>

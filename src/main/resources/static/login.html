<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FlowForge</title>

    <link rel="stylesheet" href="/auth.css">
</head>

<body>

<div class="auth-shell">

    <div class="auth-brand">
        <div class="brand-mark">F</div>
        <div>
            <h1>FlowForge</h1>
            <p>Collaborate. Organize. Deliver.</p>
        </div>
    </div>

    <div class="auth-card">

        <div class="auth-header">
            <span class="eyebrow">WELCOME BACK</span>
            <h2>Sign in to FlowForge</h2>
            <p>Continue managing your work and collaborating with your team.</p>
        </div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <div class="field-label-row">
                    <label for="password">Password</label>
                </div>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div id="message" class="message"></div>

            <button type="submit" id="loginButton" class="auth-button">
                <span>Sign in</span>
                <span class="button-arrow">→</span>
            </button>

        </form>

        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a href="/register.html">Create one</a>
        </div>

    </div>

    <div class="auth-bottom">
        <span>FlowForge</span>
        <span>•</span>
        <span>Real-time collaborative workspace</span>
    </div>

</div>

<script src="/auth.js"></script>

</body>
</html>
